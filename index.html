<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Free Almaz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f3f6fd;--card:#fff;--line:#e7ecf6;--y:#ffb300;--t:#182034;--m:#7a849c;--b:#3b6cff;--sh:0 8px 24px rgba(50,70,130,.09)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t);font:600 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(520px 320px at 100% -4%,#dbe6ff,transparent 70%),radial-gradient(460px 300px at -8% 28%,#fff0cf,transparent 70%);pointer-events:none}
#app{position:relative;max-width:480px;margin:auto;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px}
.who span{display:block;font-size:12px;color:var(--m)}
.who b{display:block;font-size:20px;font-weight:800;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:42px;height:42px;border:0;border-radius:14px;background:#fff;box-shadow:var(--sh);color:var(--t);display:grid;place-items:center}
.ic svg{width:20px;height:20px}
main{flex:1;overflow-y:auto;padding:8px 16px 22px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pg{display:none}.pg.on{display:block;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.lb{font-size:12px;color:var(--m);font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.sm{font-size:13px;color:var(--m);font-weight:500}
.hero{position:relative;overflow:hidden;text-align:center;padding:28px 18px 26px;background:linear-gradient(135deg,#3b6cff,#7a4dff);color:#fff;box-shadow:0 14px 30px rgba(80,90,255,.32)}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-90px;background:rgba(255,255,255,.12)}
.hero .lb{color:#dbe2ff}
.big{display:flex;align-items:center;justify-content:center;gap:10px;font-size:52px;font-weight:900;margin-top:6px;position:relative}
.big svg{width:46px;height:46px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.fl{position:absolute;opacity:.55;animation:fl 5s ease-in-out infinite}
.f1{width:26px;height:26px;left:20px;top:22px}.f2{width:18px;height:18px;left:48px;bottom:24px;animation-delay:-2s}.f3{width:22px;height:22px;right:28px;bottom:28px;animation-delay:-3.5s}
@keyframes fl{50%{transform:translateY(-9px) rotate(10deg)}}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:800 15px system-ui,sans-serif;background:linear-gradient(180deg,#ffd13d,#ff9f1a);color:#3d2400;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 18px rgba(255,159,26,.35);transition:transform .1s}
.btn:active{transform:scale(.97)}.btn:disabled{background:#e9eef7;color:#a2abc0;box-shadow:none}
.btn.o{background:#fff;color:var(--t);border:1px solid var(--line);box-shadow:none}
.btn svg{width:18px;height:18px}
.gap{height:10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.day{background:#f4f7fd;border-radius:13px;padding:9px 0;text-align:center;font-size:11px;color:var(--m);border:1.5px solid transparent}
.day b{display:block;font-size:14px;color:var(--t);margin-top:2px}
.day.ok{background:linear-gradient(180deg,#ffd13d,#ff9f1a);color:#6b4300}.day.ok b{color:#3d2400}
.day.cur{border-color:var(--y);background:#fff8e6}
.wh{position:relative;width:250px;height:250px;margin:18px auto}
.wh #wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 18px rgba(60,80,150,.25))}
#wheel{transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.wh .ptr{position:absolute;left:50%;top:-10px;width:26px;height:30px;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 3px 4px rgba(255,91,58,.4))}
.link{background:#f4f7fd;border-radius:14px;padding:13px;margin:12px 0;font-size:13px;font-weight:600;color:var(--b);word-break:break-all}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stats .card{margin:0;text-align:center}.stats b{display:block;font-size:28px;color:#ff8a00;margin-top:2px}
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stats4 .card{margin:0;text-align:center;padding:14px}.stats4 b{display:block;font-size:24px;color:var(--b);margin-top:2px}
.rule{display:flex;align-items:center;gap:12px;margin-bottom:4px}.rule svg{width:40px;height:40px;flex:none}.rule b{font-size:20px}
input,textarea{width:100%;background:#f4f7fd;border:1.5px solid transparent;border-radius:14px;color:var(--t);padding:14px;font:600 16px system-ui;margin:12px 0;outline:0;user-select:text;-webkit-user-select:text}
select{width:100%;background:#f4f7fd;border:1.5px solid transparent;border-radius:14px;color:var(--t);padding:14px;font:600 16px system-ui;margin:0 0 4px;outline:0}textarea{min-height:90px;resize:none}input:focus,textarea:focus{border-color:var(--y);background:#fff}
.chips{display:flex;gap:8px;margin-bottom:14px}.chip{flex:1;text-align:center;padding:13px 0;border-radius:14px;background:#f4f7fd;border:1.5px solid transparent;font-weight:800}.chip.on{background:#fff8e6;border-color:var(--y);color:#c77700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0;padding-bottom:0}.row:first-child{padding-top:0}
.row span:last-child{font-weight:800;white-space:nowrap}.pl{color:#16a34a}.mn{color:#e0453a}
.req{margin-top:14px}.req .h{display:flex;justify-content:space-between;font-size:13px;color:var(--m)}.req b{color:var(--t)}
.pb{height:8px;background:#edf1f9;border-radius:4px;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd13d,#ff9f1a);border-radius:4px;transition:width .5s}
.tb{border:0;border-radius:12px;background:linear-gradient(180deg,#ffd13d,#ff9f1a);color:#3d2400;font:800 13px system-ui,sans-serif;padding:10px 14px;min-width:98px;transition:transform .1s}.tb:active{transform:scale(.96)}.tb:disabled{background:#e9eef7;color:#a2abc0}
.tb.no{background:#fff;color:#e0453a;border:1px solid #f3c6c2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.two .tb{min-width:0}
.ib{width:40px;height:40px;border-radius:13px;background:#eef2ff;color:var(--b);display:grid;place-items:center;flex:none}.ib svg{width:20px;height:20px}.tx{flex:1;min-width:0}
.pill{display:inline-block;margin-left:6px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:800}.pill.wait{background:#fff4d6;color:#b57600}.pill.ok{background:#dcf7e6;color:#16a34a}.pill.no{background:#fde4e2;color:#e0453a}
input[type=checkbox]{width:20px;height:20px;margin:0;padding:0;accent-color:var(--b);flex:none}.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 0 14px;color:var(--m)}
.req2{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.req2:last-child{border:0}
nav{display:flex;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(50,70,130,.1);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
nav button{flex:1;background:0;border:0;color:#9aa4ba;padding:9px 0 7px;font:700 11px system-ui;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .2s}
nav button svg{width:24px;height:24px;transition:transform .2s}nav button.on{color:var(--b)}nav button.on svg{transform:translateY(-2px) scale(1.12)}
.toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-20px);background:#182034;color:#fff;border-radius:14px;padding:11px 18px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90%;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
.pop{position:fixed;inset:0;background:rgba(24,32,52,.5);display:none;place-items:center;z-index:40;padding:20px}.pop.on{display:grid}
.pop>div{background:#fff;border-radius:28px;padding:30px 36px;text-align:center;width:100%;max-width:300px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:zoom .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes zoom{from{transform:scale(.8);opacity:0}}
.pop .big{font-size:56px;margin:8px 0 20px;color:#ff9a1a}.pop p:empty{display:none}.pop p{margin:-10px 0 20px}
#ld{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--m);font-size:14px;text-align:center;padding:20px}
.hd{display:flex;align-items:center;gap:12px}.av{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#3b6cff,#7a4dff);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:900;overflow:hidden;flex:none;box-shadow:0 8px 16px rgba(80,90,255,.3)}.av img{width:100%;height:100%;object-fit:cover}
.ldm{width:64px;height:64px;animation:fl 2s ease-in-out infinite}
.sp{width:36px;height:36px;border-radius:50%;border:4px solid #dbe3f5;border-top-color:var(--b);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ff3ff"/><stop offset="1" stop-color="#2a7bff"/></linearGradient>

<div id="app">
<header><div class="hd"><div class="av" id="av"></div><div class="who"><span>Salom</span><b id="nm"></b></div></div><button class="ic" id="snd" aria-label="Ovoz"><svg><use id="sndi" href="#i-on"/></svg></button></header>
<main>

  <div class="card hero"><svg class="fl f1"><use href="#dm"/></svg><svg class="fl f2"><use href="#dm"/></svg><svg class="fl f3"><use href="#dm"/></svg><div class="lb">Balans</div><div class="big"><svg><use href="#dm"/></svg><span id="bal">0</span></div></div>

<script>
/* ===== SOZLAMALAR (server yuboradi; bu yerda faqat zaxira) ===== */
const CFG={BOT:"",REF:22,MIN_REFS:15,MIN:[110,220,583],DAYS:[5,10,15,20,30,40,100],SPIN:[1,2,3,5,10,15,25,50],SPIN_CD:6*3600e3,WELCOME:10,REF_NEED:3,TASKS:[]};

const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor("#f3f6fd");tg.setBackgroundColor&&tg.setBackgroundColor("#f3f6fd")}
const $=id=>document.getElementById(id),$$=s=>[...document.querySelectorAll(s)];
const tu=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
const UI=(()=>{try{return JSON.parse(localStorage.getItem("fa_ui"))||{}}catch(e){return{}}})();
let S={bal:0,refs:0,streak:0,lastDay:0,spinAt:0,tasks:{},hist:[],id:0,snd:UI.snd!==false,tab:UI.tab,ff:UI.ff||""};
const save=()=>localStorage.setItem("fa_ui",JSON.stringify({snd:S.snd,tab:S.tab,ff:S.ff}));

/* ===== SERVER ===== */
let off=0,ready=false,spinning=false,busy=false,sel=0;const busyT={},now=()=>Date.now()+off;
const DEVID=localStorage.fa_dev||(localStorage.fa_dev=String(Math.floor(1e6+Math.random()*9e6)));
async function api(p,b){let r;try{r=await fetch("/api/"+p,{method:"POST",headers:{"Content-Type":"application/json","X-Init":(tg&&tg.initData)||"","X-Dev":DEVID},body:JSON.stringify(b||{})})}catch(e){throw new Error("Aloqa yo'q")}
  let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.e||"Server xatosi");return j}
async function act(f){if(busy)return;busy=true;try{await f()}catch(e){sErr();toast(e.message)}busy=false}
function setS(n){const r0=S.refs,wait=S.hist.filter(h=>h.st==="wait").map(h=>h.id);off=n.now-Date.now();const{now:_,...d}=n;Object.assign(S,d);
  if(ready){if(S.refs>r0)setTimeout(()=>popup((S.refs-r0)*CFG.REF,"Yangi do'st"),300);
    wait.forEach(id=>{const h=S.hist.find(x=>x.id===id);if(h&&h.st==="ok"){toast("So'rov tasdiqlandi");sWin()}else if(h&&h.st==="no"){toast("So'rov rad etildi");sErr()}})}
  ready=true}
const refresh=()=>{if(!document.hidden&&!spinning&&!busy)api("me").then(j=>{Object.assign(CFG,j.cfg);setS(j.s);render()}).catch(()=>{})};

/* ===== OVOZ ===== */
let AC;function tone(f,d=.12,t="square",v=.07,w=0){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+w;o.type=t;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
const sClick=()=>{tone(520,.06);tone(780,.07,"square",.05,.05)};
const sWin=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.18,"triangle",.11,i*.09));
const sErr=()=>tone(180,.2,"sawtooth",.09);
const sTick=()=>tone(900,.03,"square",.035);
const vib=()=>{try{tg&&tg.HapticFeedback?tg.HapticFeedback.impactOccurred("medium"):navigator.vibrate&&navigator.vibrate(30)}catch(e){}};

/* ===== UI ===== */
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200)}
function popup(v,t){$("pv").textContent="+"+v;$("pt").textContent=t;$("ps").textContent="";$("pop").classList.add("on");sWin();vib()}
$("pk").onclick=()=>$("pop").classList.remove("on");
$("pop").onclick=e=>{if(e.target===$("pop"))$("pop").classList.remove("on")};
let shown=0;function count(){const to=S.bal,st=shown,t0=performance.now();if(st===to)return;(function f(n){const p=Math.min(1,(n-t0)/600);shown=Math.round(st+(to-st)*p);$("bal").textContent=shown;if(p<1)requestAnimationFrame(f)})(t0)}
const fmt=ms=>{const s=Math.ceil(ms/1e3),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} soat ${m} daqiqa`:`${m} daqiqa ${s%60} soniya`};
const hm=t=>{const d=new Date(t),p=n=>String(n).padStart(2,"0");return p(d.getDate())+"."+p(d.getMonth()+1)+" "+p(d.getHours())+":"+p(d.getMinutes())};
const link=()=>`https://t.me/${CFG.BOT}?start=ref_${S.id}`;
const dayN=t=>Math.floor((t+5*36e5)/864e5); // UTC+5
function dState(){const t=dayN(now());if(S.lastDay===t)return{done:true,c:((S.streak-1)%7)+1};return{done:false,c:S.lastDay&&S.lastDay!==t-1?0:S.streak%7}}
function tick(){const left=S.spinAt+CFG.SPIN_CD-now();$("spin").disabled=left>0||spinning;$("spinInfo").textContent=left>0?"Keyingi: "+fmt(left):"";if($("claim").disabled&&!dState().done)render()}

function render(){
  if(sel>=CFG.MIN.length)sel=0;count();$("sndi").setAttribute("href",S.snd?"#i-on":"#i-off");const nm=(tu&&(tu.first_name||tu.username))||"o'yinchi";$("nm").textContent=nm;
  if($("av").dataset.d!==nm){$("av").dataset.d=nm;$("av").textContent=nm[0].toUpperCase();if(tu&&tu.photo_url){const im=new Image();im.onload=()=>{$("av").textContent="";$("av").appendChild(im)};im.src=tu.photo_url}}
  const d=dState();
  $("days").innerHTML=CFG.DAYS.map((v,i)=>`<div class="day ${i<d.c?"ok":""} ${i===d.c&&!d.done?"cur":""}">${i+1}<b>${v}</b></div>`).join("");
  $("claim").disabled=d.done;$("claim").textContent=d.done?"Ertaga qaytib keling":"Bonusni olish";
  $("rb").textContent="+"+CFG.REF+" almaz";$("rs").textContent=CFG.REF_NEED?"do'st "+CFG.REF_NEED+" ta vazifa bajarsa":"do'st botga kirsa";
  $("fl").innerHTML=(S.fl&&S.fl.length)?S.fl.map(f=>`<div class="row"><div class="tx">${esc(f.n||"Do'st")}</div><span class="pill ${f.d?"ok":"wait"}">${f.d?"+"+CFG.REF+" almaz":f.c+" / "+CFG.REF_NEED+" vazifa"}</span></div>`).join(""):'<div class="sm">Hozircha bo\'sh</div>';
  $("fp").textContent=Math.min(S.refs,CFG.MIN_REFS)+" / "+CFG.MIN_REFS;$("fpb").style.width=Math.min(100,S.refs/CFG.MIN_REFS*100)+"%";$("fc").textContent=S.refs;$("fe").textContent=S.refs*CFG.REF;$("lk").textContent=link();
  $("chips").innerHTML=CFG.MIN.map((m,i)=>`<div class="chip ${i===sel?"on":""}" data-i="${i}">${m}</div>`).join("");
  $$(".chip").forEach(c=>c.onclick=()=>{sel=+c.dataset.i;sClick();render()});
  const m=CFG.MIN[sel],R=CFG.MIN_REFS;
  $("rq1").textContent=Math.min(S.bal,m)+" / "+m;$("pb1").style.width=Math.min(100,S.bal/m*100)+"%";
  $("rq2").textContent=Math.min(S.refs,R)+" / "+R;$("pb2").style.width=Math.min(100,S.refs/R*100)+"%";
  $("wd").disabled=S.bal<m||S.refs<R;
  $("wdinfo").textContent=S.refs<R?"Yana "+(R-S.refs)+" do'st kerak":S.bal<m?"Yana "+(m-S.bal)+" almaz kerak":"";
  $("tl").innerHTML=CFG.TASKS.map(k=>{const dn=S.tasks[k.id],bz=busyT[k.id],lk=k.ref&&S.refs<k.ref;return `<div class="row"><div class="ib"><svg><use href="#${k.ref?"i-users":(k.share||k.cn)?"i-send":"i-link"}"/></svg></div><div class="tx">${esc(k.t)}<div class="sm" style="font-size:12px">+${k.r} almaz</div></div><button class="tb" data-t="${k.id}" ${dn||bz||lk?"disabled":""}>${dn?"Bajarildi":bz?"Kuting":lk?S.refs+" / "+k.ref:k.ref?"Olish":"Boshlash"}</button></div>`}).join("");
  $$(".tb").forEach(b=>b.onclick=()=>doTask(b.dataset.t));
  $("hist").innerHTML=S.hist.length?S.hist.slice(0,15).map(h=>`<div class="row"><div>${esc(h.txt)}<div class="sm" style="font-size:12px">${hm(h.time)}${h.st?`<span class="pill ${h.st}">${({wait:"Kutilmoqda",ok:"Tasdiqlandi",no:"Rad etildi"})[h.st]}</span>`:""}</div></div><span class="${h.t==="+"?"pl":"mn"}">${h.t}${h.amt}</span></div>`).join(""):'<div class="sm">Hozircha bo\'sh</div>';
  tick();
}
function go(p,q){$$(".pg").forEach(e=>e.classList.toggle("on",e.id==="p-"+p));$$("nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===p));S.tab=p;save();document.querySelector("main").scrollTop=0;if(!q)sClick();render();if(p==="admin")admLoad()}
$$("nav button").forEach(b=>b.onclick=()=>go(b.dataset.go));
$("snd").onclick=()=>{S.snd=!S.snd;save();sClick();render()};
document.addEventListener("click",e=>{if(e.target.closest(".btn"))sClick()},true);

/* ===== G'ILDIRAK ===== */
const COL=["#ffe08a","#cfe0ff","#ffd2c2","#cdeedb","#e3d6ff","#fff0b3","#bfe9ff","#ffc9d6"];
function buildWheel(){const n=8,a=360/n,P=(r,d)=>[(r*Math.sin(d*Math.PI/180)).toFixed(2),(-r*Math.cos(d*Math.PI/180)).toFixed(2)];let h="";
  for(let i=0;i<n;i++){const[x1,y1]=P(96,i*a),[x2,y2]=P(96,(i+1)*a),m=i*a+a/2,[tx,ty]=P(68,m);
    h+=`<path d="M0 0L${x1} ${y1}A96 96 0 0 1 ${x2} ${y2}z" fill="${COL[i]}" stroke="#fff" stroke-width="2"/><text transform="translate(${tx} ${ty}) rotate(${m})" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="800" fill="${CFG.SPIN[i]>=25?"#d9480f":"#182034"}">${CFG.SPIN[i]}</text>`}
  $("wheel").innerHTML=h+'<circle r="97" fill="none" stroke="#ff9f1a" stroke-width="5"/><circle r="13" fill="#fff" stroke="#ff9f1a" stroke-width="4"/>'}
let rot=0;
$("spin").onclick=()=>act(async()=>{
  if(S.spinAt+CFG.SPIN_CD>now())return sErr();
  const r=await api("spin");spinning=true;$("spin").disabled=true;
  rot+=360*6+((360-(r.i*45+22.5))-(rot%360)+360)%360;$("wheel").style.transform=`rotate(${rot}deg)`;
  let k=0;const tk=setInterval(()=>{sTick();if(++k>26)clearInterval(tk)},120);
  await new Promise(z=>setTimeout(z,4300));
  spinning=false;setS(r.s);popup(r.v,"G'ildirak");render()});

/* ===== KUNLIK BONUS ===== */
$("claim").onclick=()=>act(async()=>{if(dState().done)return sErr();const r=await api("claim");setS(r.s);popup(r.v,"Kunlik bonus · "+r.day+"-kun");render()});

/* ===== VAZIFALAR ===== */
function doTask(id){const k=CFG.TASKS.find(x=>x.id===id);if(!k||S.tasks[id]||busyT[id])return;
  if(k.ref&&S.refs<k.ref){sErr();return toast(S.refs+" / "+k.ref+" do'st")}
  busyT[id]=1;
  const fin=async()=>{try{const r=await api("task",{id});setS(r.s);popup(r.v,"Vazifa bajarildi")}catch(e){sErr();toast(e.message)}delete busyT[id];render()};
  if(k.url){/^https:\/\/t\.me\//.test(k.url)&&tg?tg.openTelegramLink(k.url):tg&&tg.openLink?tg.openLink(k.url):window.open(k.url,"_blank");render();setTimeout(fin,5000)}
  else if(k.share){shareIt();render();setTimeout(fin,3000)}
  else{render();fin()}}

/* ===== DO'STLAR ===== */
$("copy").onclick=()=>{const l=link();(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).catch(()=>{const t=document.createElement("textarea");t.value=l;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()});toast("Nusxalandi")};
const shareIt=()=>{const u="https://t.me/share/url?url="+encodeURIComponent(link())+"&text="+encodeURIComponent("Free Fire uchun almaz yig'ing:");tg?tg.openTelegramLink(u):window.open(u,"_blank")};
$("share").onclick=shareIt;

/* ===== YECHISH ===== */
$("wd").onclick=()=>act(async()=>{const id=$("ffid").value.trim(),m=CFG.MIN[sel];
  if(S.hist.some(h=>h.st==="wait")){sErr();return toast("Oldingi so'rov kutilmoqda")}
  if(S.refs<CFG.MIN_REFS||S.bal<m)return sErr();
  if(!/^\d{6,14}$/.test(id)){sErr();return toast("Free Fire ID noto'g'ri")}
  const r=await api("withdraw",{ff:id,amount:m});S.ff=id;save();setS(r.s);render();sWin();vib();toast("So'rov yuborildi")});
$("ffid").value=S.ff;$("ffid").oninput=e=>{S.ff=e.target.value;save()};

/* ===== BOSHLASH ===== */
document.addEventListener("visibilitychange",refresh);setInterval(refresh,15000);setInterval(()=>{if(!spinning)tick()},1000);
/* ===== ADMIN ===== */
const ask=m=>new Promise(z=>tg&&tg.showConfirm?tg.showConfirm(m,z):z(confirm(m)));
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let auid=0;
async function admLoad(){try{const r=await api("adm");
  $("as").innerHTML=[["Foydalanuvchi",r.users],["Bugun yangi",r.fresh],["Kutilmoqda",r.wd.length],["To'langan",r.paid]].map(x=>`<div class="card"><div class="lb">${x[0]}</div><b>${x[1]}</b></div>`).join("");
  $("aw").innerHTML=r.wd.length?r.wd.map(w=>`<div class="req2"><div>${esc(w.name||"-")} <span class="sm">(${w.uid})</span><div class="sm">ID ${esc(w.ff)} · ${w.amt} almaz · do'st ${w.refs} · ${hm(w.time)}</div></div><div class="two"><button class="tb" data-a="1" data-i="${w.id}">Tasdiqlash</button><button class="tb no" data-a="0" data-i="${w.id}">Rad etish</button></div></div>`).join(""):'<div class="sm">So\'rov yo\'q</div>';
  ["REF","MIN_REFS","WELCOME"].forEach(k=>{if(document.activeElement!==$("sc_"+k))$("sc_"+k).value=r.cfg[k]});$("sc_MIN").value=r.cfg.MIN.join(",");$("sc_DAYS").value=r.cfg.DAYS.join(",");
  $("sc_pause").textContent="Texnik ishlar: "+(r.pause?"YOQILGAN":"o'chiq");$("sc_pause").dataset.on=r.pause?"1":"0";
  const sec=(h,rows)=>`<div class="sm" style="margin:10px 0 4px"><b>${h}</b></div>`+(rows.length?rows.join(""):'<div class="sm">Yo\'q</div>');
  $("ah").innerHTML=sec("Eng ko'p taklif qilganlar",r.top.filter(u=>u.refs>0).map(u=>`<div class="row"><div class="tx">${esc(u.n||"-")} <span class="sm">(${u.id})</span></div><span>${u.refs}</span></div>`))
    +sec("Oxirgi so'rovlar",r.done.map(w=>`<div class="row"><div class="tx">${esc(w.n||"-")} <span class="sm">ID ${esc(w.ff)} · ${w.amt}</span></div><span class="pill ${w.st}">${w.st==="ok"?"Tasdiqlandi":"Rad etildi"}</span></div>`))
    +sec("Admin harakatlari",r.log.map(l=>`<div class="row"><div class="tx" style="font-size:13px">${esc(l.x)}<div class="sm" style="font-size:11px">${hm(l.t)}</div></div></div>`));
  $("at_n").textContent="Ref uchun hisoblanadigan kanal vazifalari: "+r.cnt+" / 3";$("at_n").style.color=r.cnt<3?"#e0453a":"";
  $("at").innerHTML=r.tasks.length?r.tasks.map(t=>`<div class="row"><div class="tx">${esc(t.t)}<div class="sm" style="font-size:12px">+${t.r} almaz · ${t.ref?t.ref+" do'st":t.chat?(t.priv?"yopiq kanal":"ochiq kanal")+" · refga hisoblanadi":"havola"}</div></div><button class="tb no" data-d="${t.id}" style="min-width:0">O'chirish</button></div>`).join(""):'<div class="sm" style="margin-bottom:6px">Qo\'shilgan vazifa yo\'q</div>';
  $$("#at [data-d]").forEach(b=>b.onclick=()=>act(async()=>{await api("adm_task_del",{id:b.dataset.d});toast("O'chirildi");admLoad()}));
  $$("#aw [data-a]").forEach(b=>b.onclick=()=>act(async()=>{await api("adm_wd",{id:b.dataset.i,ok:b.dataset.a==="1"});toast(b.dataset.a==="1"?"Tasdiqlandi":"Rad etildi");sWin();admLoad()}))}
  catch(e){toast(e.message)}}
const PH={pub:"https://t.me/kanal",priv:"Kanal/guruh ID (-100...)",link:"https://...",ref:"Do'stlar soni (masalan 5)"};$("at_k").onchange=()=>{$("at_u").placeholder=PH[$("at_k").value]};
$("at_add").onclick=()=>act(async()=>{await api("adm_task_add",{k:$("at_k").value,t:$("at_t").value,r:$("at_r").value,v:$("at_u").value});["at_t","at_r","at_u"].forEach(i=>$(i).value="");toast("Qo'shildi");admLoad()});
$("sc_save").onclick=()=>act(async()=>{await api("adm_cfg",Object.fromEntries(["REF","MIN_REFS","WELCOME","MIN","DAYS"].map(k=>[k,$("sc_"+k).value])));toast("Saqlandi");admLoad()});
$("sc_pause").onclick=()=>act(async()=>{if(!await ask("Holat o'zgartirilsinmi?"))return;await api("adm_pause",{on:$("sc_pause").dataset.on==="1"?0:1});admLoad()});
const findUser=async()=>{const r=await api("adm_user",{id:$("au_id").value.trim()});auid=r.id;
  $("au_info").innerHTML=`<b>${esc(r.name||"-")}</b> (${r.id})<br>Balans: ${r.bal} · Do'st: ${r.refs} · Taklif qilgan: ${r.by||"-"}<br>FF ID: ${esc(r.ff||"-")} · ${r.ban?"BLOKLANGAN":"faol"}<br>${r.hist.map(h=>h.t+h.amt+" "+esc(h.txt)).join("<br>")}`;
  $("au_box").style.display="block";$("au_ban").textContent=r.ban?"Blokdan chiqarish":"Bloklash"};
$("au_find").onclick=()=>act(findUser);
$("au_give").onclick=()=>act(async()=>{const r=await api("adm_give",{id:auid,amount:$("au_amt").value});toast("Balans: "+r.bal);$("au_amt").value="";await findUser()});
$("au_ban").onclick=()=>act(async()=>{const r=await api("adm_ban",{id:auid,on:$("au_ban").textContent==="Bloklash"});toast(r.ban?"Bloklandi":"Ochildi");await findUser()});
$("ac_send").onclick=()=>act(async()=>{const t=$("ac_txt").value.trim();if(!t||!await ask("Hammaga yuborilsinmi?"))return;const r=await api("adm_cast",{text:t});$("ac_txt").value="";toast(r.n+" kishiga yuborilmoqda")});

(async()=>{
  const ref=new URLSearchParams(location.search).get("ref")||"";let j=null,er="";
  for(let i=0;i<20&&!j;i++){try{j=await api("me",{ref})}catch(e){er=e.message;if(/Telegram|bloklangan|Texnik/.test(er))break;$("lt").textContent="Server uyg'onmoqda, kuting...";await new Promise(z=>setTimeout(z,3000))}}
  if(!j){$("lt").textContent=er||"Aloqa yo'q";$$("#ld .sp").forEach(x=>x.style.display="none");return}
  Object.assign(CFG,j.cfg);setS(j.s);buildWheel();
  if(j.admin){$("navAdm").style.display=""}
  if(S.tab&&S.tab!=="home"&&(S.tab!=="admin"||j.admin))go(S.tab,1);
  render();$("ld").remove();
  if(j.fresh)setTimeout(()=>popup(CFG.WELCOME,"Xush kelibsiz"),400);
})();
</script>
</body>
</html>
